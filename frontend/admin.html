<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | Kuis GenBI</title>
<link rel="icon" href="favicon.ico">
<style>
:root { --green: #174c36; --ink: #203329; --muted: #64746a; }
* { box-sizing: border-box; }
body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: linear-gradient(135deg, #eff8ee, #fff7e8); color: var(--ink); min-height: 100vh; }
.wrap { max-width: 900px; margin: 0 auto; padding: 24px 15px 60px; }
.card { background: #fff; border: 1px solid #e1ebdf; border-radius: 18px; box-shadow: 0 14px 36px rgba(20,65,44,.12); padding: 24px; margin-bottom: 20px; }
h1 { color: var(--green); margin: 0 0 4px; }
.sub { color: var(--muted); margin: 0 0 16px; }
label { display: block; font-weight: 700; margin: 12px 0 4px; }
input, textarea, select { width: 100%; padding: 10px 12px; border: 1px solid #cfddd0; border-radius: 10px; font: inherit; }
textarea { min-height: 70px; resize: vertical; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.btn { border: none; border-radius: 12px; padding: 10px 20px; font-weight: 800; font-size: 1rem; cursor: pointer; }
.btn-primary { background: var(--green); color: #fff; }
.btn-danger { background: #d65b5b; color: #fff; }
.btn-ghost { background: #eef4ee; color: var(--green); }
table { width: 100%; border-collapse: collapse; margin-top: 12px; }
th, td { text-align: left; padding: 10px; border-bottom: 1px solid #e6eee6; vertical-align: top; }
th { color: var(--green); }
.badge { display: inline-block; min-width: 28px; text-align: center; background: var(--green); color: #fff; border-radius: 8px; padding: 2px 8px; font-weight: 800; }
.err { background: #fff0ee; border: 1px solid #d65b5b; color: #b93838; border-radius: 10px; padding: 8px 12px; font-weight: 700; margin-top: 10px; }
.ok { background: #e2f6e8; border: 1px solid #32935b; color: #174c36; border-radius: 10px; padding: 8px 12px; font-weight: 700; margin-top: 10px; }
.hidden { display: none !important; }
.topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
a.back { color: var(--green); font-weight: 800; text-decoration: none; }
.actions { display: flex; gap: 8px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <h1>⚙️ Admin Kuis GenBI</h1>
    <a class="back" href="index.html">← Halaman Game</a>
  </div>

  <!-- LOGIN -->
  <section id="loginCard" class="card">
    <p class="sub">Masuk dulu untuk mengelola soal.</p>
    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" type="email" required autocomplete="username" placeholder="admin@genbi.id">
      <label for="password">Password</label>
      <input id="password" type="password" required autocomplete="current-password" placeholder="••••••••">
      <div style="margin-top:14px;"><button class="btn btn-primary" type="submit">Masuk</button></div>
      <div id="loginMsg"></div>
    </form>
  </section>

  <!-- DASHBOARD -->
  <section id="dash" class="hidden">
    <div class="card">
      <div class="topbar">
        <p class="sub" id="hello" style="margin:0;"></p>
        <button class="btn btn-ghost" id="logoutBtn">Keluar</button>
      </div>
      <div id="dashMsg"></div>
      <table>
        <thead><tr><th style="width:40px;">#</th><th>Soal</th><th style="width:60px;">Benar</th><th style="width:150px;">Aksi</th></tr></thead>
        <tbody id="qTable"></tbody>
      </table>
    </div>

    <div class="card">
      <h1 id="formTitle" style="font-size:1.2rem;">➕ Tambah Soal</h1>
      <form id="qForm">
        <input type="hidden" id="qId">
        <label for="fq">Pertanyaan</label>
        <textarea id="fq" required></textarea>
        <div class="row">
          <div><label for="fa">Pilihan A</label><input id="fa" required></div>
          <div><label for="fb">Pilihan B</label><input id="fb" required></div>
        </div>
        <div class="row">
          <div><label for="fans">Jawaban benar</label>
            <select id="fans"><option value="0">A</option><option value="1">B</option></select>
          </div>
          <div><label for="fex">Penjelasan (opsional)</label><input id="fex"></div>
        </div>
        <div style="margin-top:14px; display:flex; gap:8px;">
          <button class="btn btn-primary" type="submit">Simpan</button>
          <button class="btn btn-ghost" type="button" id="resetBtn">Batal / Baru</button>
        </div>
        <div id="formMsg"></div>
      </form>
    </div>
  </section>

</div>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
